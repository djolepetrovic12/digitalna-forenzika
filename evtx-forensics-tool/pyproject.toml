[project]
name = "evtx-forensics-tool"
version = "0.1.0"
description = "Windows Event Log forensic analyzer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-evtx>=0.8.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
